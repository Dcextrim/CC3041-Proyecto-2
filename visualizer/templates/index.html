<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador de Coloracion de Grafos</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <aside class="panel">
      <h1>Coloracion de Grafos</h1>
      <p class="subtitle">Visualizacion paso a paso de Greedy y DP bitmask</p>

      <div class="control-grid">
        <label>
          Modo de vista
          <select id="viewMode">
            <option value="single">Una corrida</option>
            <option value="compare">Comparar Greedy vs DP</option>
          </select>
        </label>

        <label>
          Algoritmo
          <select id="algorithm">
            <option value="greedy">Greedy (LDF)</option>
            <option value="dp">DP exacto (bitmask)</option>
          </select>
        </label>

        <label>
          Tipo de grafo
          <select id="graphType">
            <option value="random">Aleatorio (Erdos-Renyi)</option>
            <option value="complete">Completo</option>
            <option value="bipartite">Bipartito</option>
            <option value="cycle">Ciclo</option>
            <option value="crown">Counterexample Crown</option>
          </select>
        </label>

        <label>
          n
          <input id="n" type="number" min="3" max="140" value="12">
        </label>

        <label>
          p (solo aleatorio)
          <input id="p" type="number" min="0" max="1" step="0.05" value="0.45">
        </label>

        <label>
          Semilla
          <input id="seed" type="number" min="0" value="42">
        </label>

        <label>
          Velocidad (ms por paso)
          <input id="speed" type="number" min="20" max="4000" value="260">
        </label>

        <label>
          Orden greedy
          <select id="orderMode">
            <option value="ldf">LDF (por grado)</option>
            <option value="bad">Desfavorable (crown)</option>
            <option value="good">Favorable (crown)</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="runBtn" class="btn primary">Ejecutar</button>
        <button id="pauseBtn" class="btn" disabled>Pausar</button>
        <button id="stepBtn" class="btn" disabled>Paso</button>
        <button id="resetBtn" class="btn" disabled>Reset</button>
      </div>

      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="stats">
        <div><span class="k">Estado:</span> <span id="statusText">Listo</span></div>
        <div><span class="k">Grafo:</span> <span id="graphLabel">-</span></div>
        <div><span class="k">Vertices:</span> <span id="vertices">-</span></div>
        <div><span class="k">Aristas:</span> <span id="edges">-</span></div>
        <div><span class="k">Colores usados:</span> <span id="colorsUsed">-</span></div>
        <div class="timing-stat">
          <span class="k">Tiempo de cómputo</span>
          <div id="timingCard"><span class="t-pill">–</span></div>
        </div>
        <div><span class="k">Paso:</span> <span id="stepCounter">0/0</span></div>
      </div>

      <div class="log">
        <h3>Evento</h3>
        <p id="eventText">Configura parametros y presiona Ejecutar.</p>
      </div>
    </aside>

    <main class="stage">
      <div id="singleStage" class="stage-view">
        <canvas id="graphCanvas"></canvas>
      </div>

      <div id="compareStage" class="stage-view compare hidden">
        <section class="compare-pane">
          <h2>Greedy</h2>
          <canvas id="greedyCanvas" class="compare-canvas"></canvas>
        </section>

        <section class="compare-pane">
          <h2>DP</h2>
          <canvas id="dpCanvas" class="compare-canvas"></canvas>
        </section>
      </div>

      <div class="legend" id="legend"></div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
